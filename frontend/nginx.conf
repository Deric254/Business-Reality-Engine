server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. CSP allows the Google Fonts the UI uses; tokens live in
    # sessionStorage, so a strict script-src is the main XSS mitigation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;                        # file-connector uploads
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;                      # SPA routing
    }
}
