# Free-tier stack for ONE small server (Google e2-micro / Oracle free VM):
# Caddy (automatic HTTPS) + API (1 worker). Database = Neon (external), web page = Cloudflare Pages.
# Usage (on the server):  cp env.example .env && nano .env && docker compose up -d --build
services:
  migrate:
    build: ../..
    command: ["alembic", "upgrade", "head"]
    environment: &api_env
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ENV: production
      API_KEY: ${API_KEY:?set API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      LICENCE_ENFORCED: ${LICENCE_ENFORCED:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?set CONNECTOR_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS (your Cloudflare Pages URL) in .env}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      TRUSTED_PROXY_HOPS: "1"
      WEB_CONCURRENCY: "1"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}

  api:
    build: ../..
    restart: unless-stopped
    mem_limit: 512m
    environment: *api_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/').status==200 else 1)"]
      interval: 30s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  caddy_data:
