name: Windows agent

# Builds RealityAgent.exe: the one file an owner downloads and double-clicks (no Python, no commands).
# Fully automatic: every push to main that touches agent/ rebuilds the exe, tests it and publishes it as the
# "agent-latest" release. The server finds that file by itself (no setting to paste). Nothing to run by hand;
# "Run workflow" is there only for a forced rebuild. Push a tag like agent-v2.1.0 to also keep a numbered release.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["agent/**", ".github/workflows/agent-windows.yml"]   # any change to the agent rebuilds and republishes it by itself
    tags: ["agent-v*"]

concurrency:
  group: windows-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller sqlcipher3-wheels
      - name: Build
        run: >
          pyinstaller --onefile --noconsole --name RealityAgent --paths agent
          --add-data "agent/profiles;profiles" --hidden-import sqlcipher3
          agent/reality_agent_app.py
      - name: Smoke test (starts, serves its page only to this computer, refuses without the key)
        shell: pwsh
        run: |
          $env:REALITY_AGENT_HOME = "$PWD\smoke-home"
          $p = Start-Process -FilePath dist\RealityAgent.exe -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 8
          $key = (Get-Content "$env:REALITY_AGENT_HOME\ui.key").Trim()
          try { Invoke-WebRequest http://127.0.0.1:47821/ -UseBasicParsing | Out-Null; throw "page served without the key" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw } }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest "http://127.0.0.1:47821/?k=$key" -WebSession $s -UseBasicParsing | Out-Null
          $r = Invoke-WebRequest http://127.0.0.1:47821/api/status -WebSession $s -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "status failed" }
          Stop-Process -Id $p.Id -Force
          reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v RealityAgent /f
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: RealityAgent
          path: dist/RealityAgent.exe
      - name: Publish rolling release (permanent download link)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          gh release view agent-latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create agent-latest dist/RealityAgent.exe --title "Reality agent (latest)" --notes "Download RealityAgent.exe and double-click it."
          } else {
            gh release upload agent-latest dist/RealityAgent.exe --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        run: gh release create "${{ github.ref_name }}" dist/RealityAgent.exe --title "Reality agent ${{ github.ref_name }}" --notes "Download RealityAgent.exe and double-click it."
        env:
          GH_TOKEN: ${{ github.token }}
